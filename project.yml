name: StUrbanus
options:
  bundleIdPrefix: com.zuluindustries
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Stefans Personal Team (kostenlose Apple-ID). Andere Entwickler: eigene Team-ID eintragen
    # und `xcodegen generate` ausführen.
    DEVELOPMENT_TEAM: 2XUJFFJ4X2
targets:
  StUrbanus:
    type: application
    platform: iOS
    sources:
      - StUrbanus
    info:
      # Wird mit dem generierten Info.plist zusammengeführt. Ausweich-Namen für Siri (iOS erlaubt höchstens 3).
      path: StUrbanus/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INAlternativeAppNames:
          - INAlternativeAppName: Urbanus
          - INAlternativeAppName: Golf Caddy
          - INAlternativeAppName: Mein Caddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zuluindustries.StUrbanus
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Caddy"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Das Mikrofon wird genutzt, um Schläge per Sprache zu erfassen."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Die Spracherkennung läuft auf dem Gerät und wandelt deine Ansage in einen Schlag-Eintrag um."
  StUrbanusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StUrbanusTests
    dependencies:
      - target: StUrbanus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zuluindustries.StUrbanusTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StUrbanus:
    build:
      targets:
        StUrbanus: all
        StUrbanusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StUrbanusTests
